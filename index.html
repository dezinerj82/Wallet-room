<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap">
<style>
:root {
 --teal:#194b59; --orange:#ffb458; --cream:#fcebd9; --paper:#f4f6f5;
 --unit:min(100vw / 1920, 100dvh / 1080, 1px);
 --title:calc(42.6667 * var(--unit));
 --subtitle:calc(29.3333 * var(--unit));
 --normal:calc(21.3333 * var(--unit));
 --page:calc(32 * var(--unit));
 --card:calc(22 * var(--unit));
 --gap:calc(21.3333 * var(--unit));
 --radius:calc(21.3333 * var(--unit));
 --pill:calc(13.3333 * var(--unit));
}
@media (max-width:768px) {
 :root { --unit:min(100vw / 412, 100dvh / 891, 1px); }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; min-height:100dvh; padding:var(--page); display:grid; place-items:center; background:var(--paper); color:var(--teal); font-family:'Google Sans',Arial,sans-serif; font-size:var(--normal); line-height:1.3; }
h1,h2,p { margin:0; }
h1 { font-size:var(--title); font-weight:600; line-height:1.2; }
h2 { font-size:var(--subtitle); font-weight:500; }
button { font:inherit; color:inherit; border:0; border-radius:9999px; padding:var(--pill); background:var(--orange); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:var(--pill); }
button:disabled { cursor:default; opacity:.65; }
button:focus-visible { outline:none; box-shadow:0 0 0 calc(4 * var(--unit)) #194b5938; }
#loginCard { background:#fff; border-radius:var(--radius); padding:var(--card); width:calc(557 * var(--unit)); min-height:calc(270 * var(--unit)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--gap); text-align:center; }
#login svg { width:1.12em; height:1.12em; flex-shrink:0; }
#progress { width:100%; height:calc(7 * var(--unit)); background:var(--cream); border-radius:9999px; overflow:hidden; }
#progressFill { height:100%; width:0; border-radius:inherit; background:var(--teal); transition:width .2s ease; }
#status { color:#a64b50; overflow-wrap:anywhere; max-width:100%; }
#status:empty { display:none; }
@media (max-width:768px) { #loginCard { width:100%; min-height:0; } }
@media (prefers-reduced-motion:reduce) { #progressFill { transition:none; } }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main id="loginCard">
<h1>Wallet Room</h1>
<button id="login" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.1v5h6.6c3.9-3.6 6.1-8.8 6.1-14.8z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.7l-6.6-5c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8V33A20 20 0 0 0 24 44z"/><path fill="#FBBC05" d="M12.6 27.8a12 12 0 0 1 0-7.6V15H5.8a20 20 0 0 0 0 18z"/><path fill="#EA4335" d="M24 11.8c3 0 5.7 1 7.8 3l5.9-5.9A19.8 19.8 0 0 0 24 4 20 20 0 0 0 5.8 15l6.8 5.2c1.6-4.8 6.1-8.4 11.4-8.4z"/></svg>Continue with Google</button>
<div id="progress" role="progressbar" aria-label="Loading Wallet Room" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div id="progressFill"></div></div>
<p id="status" role="status" aria-live="polite"></p>
</main>
<main id="mainPage" hidden></main>
<button id="logout" hidden>Sign out</button>
<section id="storageTest" hidden><input id="testNote" type="text" disabled></section>
<script>
'use strict';
const login=document.getElementById('login'), logout=document.getElementById('logout'), status=document.getElementById('status');
const scope='https://www.googleapis.com/auth/drive.file';
const card=document.getElementById('loginCard'), mainPage=document.getElementById('mainPage'), progress=document.getElementById('progress'), fill=document.getElementById('progressFill');
function setProgress(value){progress.hidden=false;fill.style.width=value+'%';progress.setAttribute('aria-valuenow',String(value));}
function resetProgress(){progress.hidden=true;fill.style.width='0%';progress.setAttribute('aria-valuenow','0');}
function fail(message){resetProgress();status.textContent=message;login.disabled=false;}
let walletData=null;
let client, token=null, generation=0, folderId=null, dataId=null, savedNote='', saving=false, ready=false;
const test=document.getElementById('storageTest'), note=document.getElementById('testNote');
function checkSession(current){if(current!==generation)throw new Error('Session changed.');}
async function drive(path,access,current,options={}){
 checkSession(current);
 const res=await fetch('https://www.googleapis.com/'+path,{...options,headers:{Authorization:'Bearer '+access,...options.headers},cache:'no-store'});
 checkSession(current);
 if(!res.ok)throw new Error('Drive request failed ('+res.status+').');
 return res.json();
}
async function readData(access,current,file){
 const data=await drive('drive/v3/files/'+encodeURIComponent(file)+'?alt=media',access,current);
 if(!data||data.schemaVersion!==1||Array.isArray(data)||typeof data!=='object')throw new Error('Unrecognized data file. No changes made.');
 return data;
}
async function ensureData(access,current,folder){
 return navigator.locks.request('wallet-room-data:'+folder,async()=>{
  let page,matches=[];
  do{
   const q=new URLSearchParams({q:"trashed = false and '"+folder+"' in parents and name = 'wallet-data.json'",fields:'nextPageToken,files(id,name,mimeType)',pageSize:'100'});
   if(page)q.set('pageToken',page);
   const result=await drive('drive/v3/files?'+q,access,current);
   matches.push(...(result.files||[]));page=result.nextPageToken;
  }while(page);
  if(matches.length>1)throw new Error('Multiple data files found. No changes made.');
  let file=matches[0]?.id;
  if(!file){
   const boundary='wallet_room_'+crypto.randomUUID();
   const metadata={name:'wallet-data.json',mimeType:'application/json',parents:[folder],appProperties:{walletRoom:'data-v1'}};
   const empty={schemaVersion:1,items:[],projects:[],records:[],savings:[],iou:[],settings:{},testNote:''};
   const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(empty)+'\r\n--'+boundary+'--\r\n';
   const created=await drive('upload/drive/v3/files?uploadType=multipart&fields=id',access,current,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
   file=created.id;
   if(!file)throw new Error('Data file creation could not be confirmed.');
  }
  return {file,data:await readData(access,current,file)};
 });
}
async function savePending(){
 if(!ready||saving||note.value===savedNote)return;
 saving=true;logout.disabled=true;
 const current=generation,access=token,file=dataId,folder=folderId;
 let failed=false;
 try{
  while(current===generation&&note.value!==savedNote){
   const value=note.value;status.textContent='Saving…';
   await navigator.locks.request('wallet-room-data:'+folder,async()=>{
    const data=await readData(access,current,file);
    if((data.testNote??'')!==savedNote)throw new Error('The file changed elsewhere. Reconnect before saving.');
    data.testNote=value;
    await drive('upload/drive/v3/files/'+encodeURIComponent(file)+'?uploadType=media&fields=id',access,current,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   });
   checkSession(current);savedNote=value;
  }
  status.textContent='Saved to Google Drive.';
 }catch(e){failed=true;if(current===generation)status.textContent='Not saved. '+e.message;}
 finally{if(current===generation){saving=false;logout.disabled=false;if(failed)note.setAttribute('aria-invalid','true');else note.removeAttribute('aria-invalid');}}
}
note.addEventListener('input',savePending);
window.addEventListener('beforeunload',e=>{if(ready&&note.value!==savedNote){e.preventDefault();e.returnValue='';}});
async function ensureFolder(access,current){
 const base='https://www.googleapis.com/drive/v3/';
 async function request(path,options={}){
  if(current!==generation)throw new Error('Session changed.');
  const res=await fetch(base+path,{...options,headers:{Authorization:'Bearer '+access,...options.headers},cache:'no-store'});
  if(!res.ok)throw new Error('Drive request failed ('+res.status+').');
  return res.json();
 }
 const account=await request('about?fields=user(permissionId)');
 const accountId=account.user?.permissionId;
 if(!accountId)throw new Error('Unable to identify Drive account.');
 if(!navigator.locks)throw new Error('Use Chrome to safely set up your folder.');
 return navigator.locks.request('wallet-room-folder:'+accountId,async()=>{
  const matches=[];let page;
  do{
   const q=new URLSearchParams({q:"trashed = false and mimeType = 'application/vnd.google-apps.folder' and 'root' in parents and name = 'Wallet room'",fields:'nextPageToken,files(id,name,appProperties)',pageSize:'100'});
   if(page)q.set('pageToken',page);
   const result=await request('files?'+q);matches.push(...(result.files||[]));page=result.nextPageToken;
  }while(page);
  if(matches.length>1)throw new Error('Multiple Wallet room folders found. Please check Google Drive before continuing.');
  if(matches.length===1)return matches[0].id;
  const created=await request('files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Wallet room',mimeType:'application/vnd.google-apps.folder',parents:['root'],appProperties:{walletRoom:'root-v1'}})});
  if(!created.id)throw new Error('Folder creation could not be confirmed.');
  return created.id;
 });
}
function initialize(){
 if(!window.google?.accounts?.oauth2){status.textContent='Google login could not load. Refresh and try again.';return;}
 client=google.accounts.oauth2.initTokenClient({
 client_id:'623537097247-8cov6532dpjs199jmoqapa6g6h4ogvh1.apps.googleusercontent.com',
 scope, include_granted_scopes:false,
 callback:async response=>{
 if(response.error||!response.access_token){fail('Google authorization was not completed.');return;}
 if(!google.accounts.oauth2.hasGrantedAllScopes(response,scope)){fail('Drive permission is required.');return;}
 token=response.access_token;
 const current=++generation;
 setProgress(25);
 try{
 const found=await ensureFolder(response.access_token,current);
 if(current!==generation)return;
 folderId=found;
 setProgress(55);
 const loaded=await ensureData(response.access_token,current,found);
 checkSession(current);
 dataId=loaded.file; walletData=loaded.data; savedNote=String(loaded.data.testNote??''); note.value=savedNote; ready=true;
 if(document.fonts)await document.fonts.ready;
 checkSession(current);
 setProgress(100);
 await new Promise(resolve=>setTimeout(resolve,220));
 checkSession(current);
 card.hidden=true; mainPage.hidden=false; status.textContent='';
 }catch(e){if(current===generation){ready=false;walletData=null;token=null;folderId=null;dataId=null;fail(e.message);}}
 },
 error_callback:()=>{fail('Google login was closed or blocked. Try again.');}
 });
 login.disabled=false;
}
login.addEventListener('click',()=>{login.disabled=true;status.textContent='';setProgress(10);client.requestAccessToken({prompt:'select_account'});});
logout.addEventListener('click',()=>{if(saving)return;if(ready&&note.value!==savedNote&&!confirm('Unsaved changes will be lost. Sign out?'))return;const previous=token;ready=false;walletData=null;token=null;folderId=null;dataId=null;generation++;savedNote='';note.value='';note.disabled=true;test.hidden=true;login.hidden=false;login.disabled=false;logout.hidden=true;card.hidden=false;mainPage.hidden=true;resetProgress();status.textContent='';if(previous)google.accounts.oauth2.revoke(previous,()=>{});});
window.addEventListener('load',initialize);
</script>
</body>
</html>
