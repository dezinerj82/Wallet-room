<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap">
<style>
:root {
 --teal:#194b59; --orange:#76d6b8; --extra-bill:#fcffcd; --button-outline:#f7ff81; --cream:#fcebd9; --paper:#f4f6f5; --sage:#dfe8e1; --rose:#efdddd; --white:#fff;
 --unit:calc(.75 * min(100vw / 1920, 100dvh / 1080, 1px));
 --title:calc(42.6667 * var(--unit));
 --subtitle:calc(29.3333 * var(--unit));
 --normal:calc(21.3333 * var(--unit));
 --page:calc(32 * var(--unit));
 --card:calc(22 * var(--unit));
 --gap:calc(21.3333 * var(--unit));
 --radius:calc(32 * var(--unit));
 --pill:calc(13.3333 * var(--unit));
}
@media (max-width:768px) {
 :root { --unit:calc(.75 * min(100vw / 412, 100dvh / 891, 1px)); }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; min-height:100dvh; padding:var(--page); display:grid; place-items:center; background:var(--paper); color:var(--teal); font-family:'Google Sans',Arial,sans-serif; font-size:var(--normal); line-height:1.3; }
h1,h2,h3,p { margin:0; }
h1 { font-size:var(--title); font-weight:600; line-height:1.2; }
h2 { font-size:var(--subtitle); font-weight:500; }
button { font:inherit; color:inherit; border:0; border-radius:9999px; padding:var(--pill); background:var(--orange); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:var(--pill); }
button:disabled { cursor:default; opacity:.65; }
button:not(:disabled):not(.entry-row):is(:hover,:active,:focus-visible),.wallet-nav button[aria-selected="true"],#mainPage button.selected { box-shadow:inset 0 0 0 3px var(--button-outline); }
button:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
#loginCard { --unit:min(100vw / 1024, 100dvh / 768, 1px); background:var(--white); border-radius:calc(32 * var(--unit)); padding:var(--card); width:calc(530 * var(--unit)); min-height:calc(390 * var(--unit)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(32 * var(--unit)); text-align:center; }
#login { font-size:calc(18 * var(--unit)); min-height:calc(56 * var(--unit)); padding:calc(14 * var(--unit)) calc(28 * var(--unit)); gap:calc(18 * var(--unit)); width:100%; }
#loginActions { display:grid; grid-template-columns:max-content; justify-content:center; row-gap:calc(10 * var(--unit)); max-width:100%; }
#login .google-mark { font-size:calc(24 * var(--unit)); font-weight:400; line-height:1; flex-shrink:0; }
#progress { width:100%; height:calc(7 * var(--unit)); margin-top:calc(14 * var(--unit)); background:var(--cream); border-radius:9999px; overflow:hidden; }
#progressFill { height:100%; width:0; border-radius:inherit; background:var(--orange); transition:width .2s ease; }
#status { color:var(--teal); font-size:calc(10 * var(--unit)); overflow-wrap:anywhere; max-width:100%; width:0; min-width:100%; min-height:calc(16 * var(--unit)); opacity:.5; }
#status.error { color:#a64b50; }
#progress[hidden] { display:block !important; visibility:hidden; }
#status:empty { visibility:hidden; }
#mainPage { width:100%; max-width:calc(1920 * var(--unit) - 2 * var(--page)); height:calc(1133.333333 * var(--unit)); display:flex; flex-direction:column; gap:calc(2 * var(--gap)); align-self:center; min-height:0; }
.wallet-card { --accent:#8ebacb; --marker:#bad9e5; background:var(--white); border:1px solid var(--accent); border-radius:var(--radius); padding:var(--card); min-width:0; min-height:0; }
.wallet-card.green { --accent:#9bb887; --marker:#d0e1b9; }
.wallet-card.orange { --accent:#d5a268; --marker:#f3d29d; }
.wallet-card.pink { --accent:#c88c9d; --marker:#edc5d0; }
.wallet-card.purple { --accent:#ab96c6; --marker:#dbcaeb; }
.wallet-card.yellow { --accent:#c6ae59; --marker:#f2e2a3; }
.marker { display:inline-block; position:relative; isolation:isolate; padding:0 .18em; width:fit-content; }
.marker::before,.marker::after,.entry-row:is(:hover,:active,:focus-visible) > :not(.accounting)::before,.entry-row:is(:hover,:active,:focus-visible) > .accounting > span::before { content:""; position:absolute; inset:0 -.14em; z-index:-1; background:var(--hover-marker,var(--marker,#bad9e5)); opacity:.78; clip-path:polygon(2% 13%,8% 7%,19% 12%,29% 4%,40% 9%,54% 3%,66% 10%,78% 5%,94% 10%,98% 19%,96% 30%,100% 42%,97% 54%,99% 67%,95% 77%,98% 89%,87% 93%,74% 88%,61% 96%,49% 89%,38% 96%,25% 89%,12% 95%,2% 86%,5% 70%,0 58%,4% 45%,0 30%); transform:rotate(-1.5deg); }
.marker::after { inset:3px -.2em 2px; transform:rotate(1deg); opacity:.46; }
.wallet-row { display:flex; align-items:center; justify-content:space-between; gap:var(--gap); }
.wallet-header { background:transparent; color:var(--teal); border:0; padding:0; }
.wallet-header button { color:var(--teal); }
#mainPage button:not(.entry-row):not(.calendar-event),.wallet-dialog button { padding:5px 9px; }
.wallet-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
.wallet-dialog .wallet-actions button { font-size:10px; }
.wallet-dialog .wallet-row { align-items:flex-start; }
.wallet-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--gap); }
.wallet-stat { display:flex; flex-direction:column; gap:calc(var(--gap) / 2); }
.wallet-stat strong { font-size:var(--subtitle); font-weight:500; color:var(--marker); }
.wallet-stat[data-summary="available"] { --accent:#d5a268; --marker:#f3d29d; }
.wallet-stat[data-summary="savings"] { --accent:#8ebacb; --marker:#bad9e5; }
.wallet-stat[data-summary="income"] { --accent:#9bb887; --marker:#d0e1b9; }
.wallet-stat[data-summary="iou"] { --accent:#c88c9d; --marker:#edc5d0; }
.wallet-nav { display:flex; align-items:center; gap:10px; }
.wallet-nav button { background:var(--orange); white-space:nowrap; }
.wallet-nav #clearBill { background:#c9b5f5; margin-left:auto; }
.wallet-nav #clearBill[hidden]+button { margin-left:auto; }
.wallet-nav button[aria-selected="true"],#mainPage button.selected { background:var(--orange); }
.wallet-workspace { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:var(--gap); flex:1; min-height:0; align-items:stretch; overflow:hidden; }
.wallet-workspace:not([data-view="2 Months"]) { grid-template-columns:minmax(0,1fr); }
.wallet-months { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--gap); min-height:0; }
.wallet-side { display:grid; grid-template-rows:1fr 1fr; gap:var(--gap); min-height:0; }
.wallet-view { min-height:0; overflow:hidden; }
.wallet-card h3 { font-size:18px; font-weight:500; }
.calendar-heading { font-size:16px; font-weight:500; }
.wallet-panel > .wallet-row:has(> .calendar-heading) { margin-top:calc(1.5 * var(--gap)); }
.wallet-panel { display:flex; flex-direction:column; gap:calc(var(--gap)/2); overflow:hidden; }
.wallet-scroll { flex:1; min-height:0; overflow:auto; scrollbar-width:none; }
.wallet-scroll::-webkit-scrollbar { display:none; }
.scroll-buttons { display:flex; justify-content:center; gap:10px; flex:none; }
#mainPage .scroll-buttons button,#mainPage button.wallet-arrow,.wallet-dialog button.wallet-arrow { background:transparent; padding:5px; flex:none; }
.scroll-buttons svg,.wallet-arrow svg,.wallet-picker-button svg { width:1.4em; height:1em; fill:#8ebacb; stroke:#8ebacb; stroke-width:4; stroke-linejoin:round; flex:none; }
.entry-row { display:flex; align-items:center; justify-content:space-between; gap:calc(var(--gap)/2); padding:7px; width:100%; text-align:left; background:none; border-radius:0; }
.entry-row > span:first-child { text-decoration:underline; text-decoration-color:var(--accent,#8ebacb); text-underline-offset:.3em; text-decoration-thickness:2px; }
.entry-row > *, .accounting > span { position:relative; isolation:isolate; }
.entry-row:is(:hover,:active,:focus-visible) { --hover-marker:var(--button-outline); box-shadow:none; }
.accounting { display:inline-flex; justify-content:space-between; gap:.6em; min-width:6.5em; font-variant-numeric:tabular-nums; }
.wallet-stat .accounting { width:100%; }
.entry-row .accounting { text-align:right; }
.muted { opacity:.5; font-size:.82em; }
.space-grid { display:flex; flex-direction:column; align-content:start; }
.space-grid .entry-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,auto); gap:var(--gap); align-items:center; }
.space-grid .entry-row > :last-child { text-align:right; white-space:nowrap; }
.record-grid .record-summary { display:grid; grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,1fr)); gap:5px; align-items:center; }
.record-summary > :not(:first-child) { text-align:center; overflow-wrap:anywhere; }
.record-summary > :last-child { text-align:right; }
.record-summary > :first-child { overflow-wrap:anywhere; }
.record-summary small { font-size:inherit; }
.record-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--gap); flex:1; min-height:0; }
.record-grid.invisible-columns > .wallet-panel { background:none; border:0; padding:4px 7px; }
.record-grid.invisible-columns > .wallet-panel > h3 { font-size:15px; }
.wallet-card.inactive { --accent:#b8b8b8; --marker:#e5e5e5; color:#666; }
.record-grid.invisible-columns > .inactive .record-summary { background:#eee; color:#666; border-radius:7px; margin-bottom:5px; }
.record-date-group { margin-bottom:1em; }
.entry-row .marker.extra-bill { --marker:var(--extra-bill); }
.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; background:#e8eeee; }
.calendar-cell { background:#fff; min-height:5em; padding:.4em; min-width:0; }
.calendar-event { font-size:.82em; display:flex; justify-content:flex-start; gap:.35em; background:#edf5f6; border-radius:9999px; padding:0 4px; margin-top:.3em; width:fit-content; max-width:100%; text-align:left; white-space:nowrap; overflow:hidden; }
.calendar-event span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.calendar-event small { flex:none; font-size:.78em; }
.calendar-cell.past { background:#f8f9f9; }
.calendar-cell.past > .calendar-day, .calendar-event.past-cleared { opacity:.3; }
.calendar-cell[data-add-date] { cursor:pointer; }
.calendar-hours { display:grid; grid-template-columns:3.5em repeat(var(--days),minmax(0,1fr)); gap:1px; background:#e8eeee; }
.calendar-hours > div { background:white; min-width:0; padding:.3em; min-height:3em; }
.wallet-dialog { border:1px solid #ab96c6; border-radius:var(--radius); color:var(--teal); background:#fff; width:min(90vw,42em); max-height:85dvh; padding:var(--card); font:inherit; }
.wallet-dialog::backdrop { background:#194b5940; }
.wallet-form { display:flex; flex-direction:column; gap:var(--gap); }
.wallet-form label { display:flex; flex-direction:column; gap:.3em; min-width:0; }
.wallet-form input:not([type=checkbox]),.wallet-form textarea,.wallet-form select,.wallet-form button.wallet-picker-button { border:1px solid #d3e2e5; border-radius:12px; padding:12px; background:var(--paper); font:inherit; color:inherit; width:100%; min-width:0; }
.wallet-picker { display:flex; flex-direction:column; gap:5px; min-width:0; }
.wallet-form button.wallet-picker-button { justify-content:space-between; text-align:left; gap:5px; }
.wallet-picker-button svg.wallet-field-icon { width:18px; height:18px; fill:none; stroke-width:2.5; stroke-linecap:round; }
.wallet-picker-options { background:white; border:1px solid #8ebacb; border-radius:12px; padding:12px; box-shadow:0 5px 15px #194b5910; min-width:0; }
.wallet-dialog button.wallet-choice { background:transparent; border-radius:7px; display:flex; width:100%; justify-content:flex-start; padding:7px; text-align:left; }
.wallet-dialog button.wallet-choice:hover,.wallet-dialog button.wallet-choice[aria-selected="true"] { background:var(--cream); }
.wallet-date-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; text-align:center; }
.wallet-dialog .wallet-date-grid button { padding:0; min-width:0; width:fit-content; justify-self:center; font-size:11px; }
.wallet-time-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
.wallet-time-grid input { text-align:center; }
.wallet-picker-options .wallet-row { gap:10px; align-items:center; }
.wallet-picker-options .wallet-actions { margin-top:5px; }
.wallet-form .record-grid { flex:none; }
.calendar-event.extra { background:var(--extra-bill); }
.wallet-form .recurrence-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--gap); }
@media (max-width:768px) {
 #loginCard { --unit:min(100vw / 412, 100dvh / 891, 1px); width:min(100%,calc(530 * var(--unit))); min-height:calc(390 * var(--unit)); }
 #mainPage { height:calc(891 * var(--unit) - 2 * var(--page)); max-width:100%; align-self:center; }
 .wallet-header h1 { font-size:var(--subtitle); }
 .wallet-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .wallet-nav { flex-wrap:wrap; gap:10px; }
 .wallet-nav button { font-size:calc(16 * var(--unit)); }
 .wallet-workspace { grid-template-columns:minmax(0,1fr); }
 .wallet-side { display:none; }
 .space-grid { grid-template-columns:1fr; }
 .record-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (prefers-reduced-motion:reduce) { #progressFill { transition:none; } }
</style>

<body>
<main id="loginCard">
<h1>Wallet Room</h1>
<div id="loginActions">
<button id="login" disabled><span class="google-mark" aria-hidden="true">G</span>Continue with Google</button>
<div id="progress" role="progressbar" aria-label="Loading Wallet Room" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div id="progressFill"></div></div>
<p id="status" role="status" aria-live="polite"></p>
</div>
</main>
<main id="mainPage" hidden>
<header class="wallet-card wallet-header wallet-row"><h1>Wallet Room</h1><div class="wallet-actions"><button type="button" id="addItem">+ Add Item</button><button id="logout" type="button" hidden>Sign out</button></div></header>
<section class="wallet-stats" aria-label="Summary">
<div class="wallet-card wallet-stat" data-summary="income"><span class="marker">Income</span><strong>—</strong></div>
<div class="wallet-card wallet-stat" data-summary="available"><span class="marker">Available</span><strong>—</strong></div>
<div class="wallet-card wallet-stat" data-summary="savings"><span class="marker">Savings</span><strong>—</strong></div>
<div class="wallet-card wallet-stat" data-summary="iou"><span class="marker">IOU</span><strong>—</strong></div>
</section>
<nav class="wallet-nav" role="tablist" aria-label="Wallet views">
<button role="tab" type="button" aria-selected="false" data-view="Calendar" aria-controls="walletContent">Calendar</button>
<button role="tab" type="button" aria-selected="true" data-view="2 Months" aria-controls="walletContent">2 Months</button>
<button role="tab" type="button" aria-selected="false" data-view="My Space" aria-controls="walletContent">My Space</button>
<button role="tab" type="button" aria-selected="false" data-view="Records" aria-controls="walletContent">Records</button>
<button type="button" id="clearBill" hidden>Clear Bill</button><button role="tab" type="button" aria-selected="false" data-view="Trash" aria-controls="walletContent">Trash</button>
</nav>
<section class="wallet-workspace" id="walletWorkspace" data-view="2 Months">
<div id="walletContent" class="wallet-months wallet-view" role="tabpanel" aria-label="2 Months">
<section class="wallet-card"><h3 id="firstMonth"></h3></section>
<section class="wallet-card"><h3 id="secondMonth"></h3></section>
</div>
<aside class="wallet-side" id="walletSide"><section class="wallet-card"><h3>Projects</h3></section><section class="wallet-card"><h3>Records</h3></section></aside>
</section>
</main>
<dialog id="entryDialog" class="wallet-dialog"></dialog>
<section id="storageTest" hidden><input id="testNote" type="text" disabled></section>
<script>
'use strict';
const login=document.getElementById('login'), logout=document.getElementById('logout'), status=document.getElementById('status');
const scope='https://www.googleapis.com/auth/drive.file';
const card=document.getElementById('loginCard'), mainPage=document.getElementById('mainPage'), progress=document.getElementById('progress'), fill=document.getElementById('progressFill');
function setProgress(value){status.classList.remove('error');status.textContent=value<25?'Connecting to Google…':value<100?'Getting your Wallet Room ready…':'All ready!';progress.hidden=false;fill.style.width=value+'%';progress.setAttribute('aria-valuenow',String(value));}
function resetProgress(){progress.hidden=true;fill.style.width='0%';progress.setAttribute('aria-valuenow','0');}
function fail(message){resetProgress();status.classList.add('error');status.textContent=message;login.disabled=false;}
let walletData=null;
const walletContent=document.getElementById('walletContent'), walletWorkspace=document.getElementById('walletWorkspace'), walletSide=document.getElementById('walletSide');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel=d=>d.getFullYear()+' '+d.toLocaleString('en',{month:'long'});
const dayKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const displayDate=x=>x&&/^\d{4}-\d{2}-\d{2}/.test(x)?monthLabel(new Date(x.slice(0,10)+'T12:00:00'))+' '+x.slice(8,10):String(x||'');
const tableDate=x=>x&&/^\d{4}-\d{2}-\d{2}/.test(x)?new Date(x.slice(0,10)+'T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}):String(x||'');
const money=x=>x==null||x===''?'': 'RM '+Math.round(Number(x)).toLocaleString('en-MY');
const accounting=(x,absolute=false)=>x==null||x===''?'':'<span class="accounting"><span>RM</span><span>'+esc(Math.round(absolute?Math.abs(Number(x)):Number(x)).toLocaleString('en-MY'))+'</span></span>';
const dialog=document.getElementById('entryDialog');
let viewName='2 Months',recordsMode='By Event',calendarMode='Month',calendarDate=new Date();
const list=(key)=>Array.isArray(walletData?.[key])?walletData[key]:[];
const all=()=>['items','projects','records','savings','iou'].flatMap(key=>list(key).map((item,index)=>({item,key,index})).filter(e=>e.item&&typeof e.item==='object'));
const nameOf=x=>x.name??x.title??x.item??'';
const dateOf=x=>x.date??x.dueDate??x.deadline??'';
const amountOf=x=>x.amount??x.cost??x.estimatedCost;
const isSpace=e=>e.key==='projects'||e.item.category==='My Space';
const categoryOf=e=>isSpace(e)?'My Space':e.item.category||(e.key==='iou'?'IOU':e.key==='savings'?'Savings':'Expense');
const stateOf=e=>String(e.item.status||'').toLowerCase();
const isPaid=e=>e.item.paid===true||['paid','cleared'].includes(stateOf(e));
const excluded=e=>['cancelled','carried forward'].includes(stateOf(e));
const today=()=>dayKey(new Date());
const monthKey=x=>String(x||'').slice(0,7);
const actualMonth=()=>today().slice(0,7);
const shiftMonth=(ym,n)=>dayKey(new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7))-1+n,1)).slice(0,7);
const lastDay=ym=>dayKey(new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0));
const isBalance=e=>e.key==='savings'&&e.item.kind==='balance';
const importedBase=e=>e.key==='items'&&e.item.source?.file==='EXPENSE.xlsx'&&!e.item.carryOf;
const baseBill=e=>categoryOf(e)==='Expense'&&!isSpace(e)&&!e.item.carryOf&&(importedBase(e)||e.item.recurring===true);
const hasAmount=e=>amountOf(e.item)!=null&&amountOf(e.item)!==''&&Number.isFinite(Number(amountOf(e.item)))&&Number(amountOf(e.item))!==0;
const dueBill=e=>!isSpace(e)&&e.key!=='records'&&['Expense','IOU'].includes(categoryOf(e))&&!excluded(e)&&hasAmount(e);
const seriesKey=e=>JSON.stringify([categoryOf(e),e.item.group||'',nameOf(e.item)]);
const itemOrderKey=e=>isSpace(e)?String(e.item.id||seriesKey(e)):seriesKey(e);
const ordered=es=>es.slice().sort((a,b)=>String(dateOf(a.item)).localeCompare(String(dateOf(b.item))));
const currentMonth=()=>{const m=walletData?.settings?.budgetMonth;if(/^\d{4}-\d{2}$/.test(m||''))return m;const open=all().filter(e=>dueBill(e)&&!isPaid(e)&&monthKey(dateOf(e.item))&&monthKey(dateOf(e.item))<=actualMonth()).map(e=>monthKey(dateOf(e.item))).sort();return open[0]||actualMonth();};
const isInactive=e=>e.key==='records'||e.item.active===false||['completed','cancelled','inactive','carried forward'].includes(stateOf(e))||(isPaid(e)&&dateOf(e.item).slice(0,10)<today())||(!isSpace(e)&&!dueBill(e)&&!e.item.recurring&&dateOf(e.item)&&monthKey(dateOf(e.item))<currentMonth());
const statusLabel=e=>isSpace(e)?(['saved',''].includes(stateOf(e))?'In Progress':e.item.status):excluded(e)?e.item.status:dueBill(e)?isPaid(e)?'Paid':'Unpaid':(e.item.recurring||importedBase(e))?'Ongoing':isInactive(e)?'Completed':'';
function seriesFor(e,entries=all()){
 const candidates=entries.filter(x=>seriesKey(x)===seriesKey(e));
 if(importedBase(e)||isBalance(e))return candidates.filter(x=>importedBase(x)||isBalance(x));
 if(e.item.recurring)return candidates.filter(x=>x.item.id===e.item.id||(e.item.seriesId&&x.item.seriesId===e.item.seriesId));
 return [e];
}
function seriesInfo(e,entries=all()){
 const members=ordered(seriesFor(e,entries)),first=members[0]||e;
 const meta=members.slice().reverse().find(x=>x.item.recurring!==undefined||x.item.startDate||x.item.endDate)?.item||{};
 const recurring=meta.recurring===false?false:!!(meta.recurring||members.length>1&&(importedBase(e)||isBalance(e)));
 return {members,recurring,start:meta.startDate||dateOf(first.item),end:meta.endDate||'',first};
}
const sortItems=(es,space=false)=>{
 const ids=walletData?.settings?.sortOrder?.[space?'space':'budget']||[],rank=new Map(ids.map((id,i)=>[id,i]));
 return es.slice().sort((a,b)=>(rank.get(itemOrderKey(a))??Number.MAX_SAFE_INTEGER)-(rank.get(itemOrderKey(b))??Number.MAX_SAFE_INTEGER));
};
function monthlyEntries(entries,ym){
 const same=sortItems(entries.filter(e=>!isSpace(e)&&e.key!=='records'&&!excluded(e)&&monthKey(dateOf(e.item))===ym&&hasAmount(e)));
 const result=[];
 for(const e of same){
  const group=result.find(x=>seriesKey(x.e)===seriesKey(e));
  const extra=dueBill(e)&&!baseBill(e);
  if(group){group.amount+=Number(amountOf(e.item));group.extra||=extra;group.members.push(e);if(baseBill(e)&&!baseBill(group.e))group.e=e;}
  else result.push({e,amount:Number(amountOf(e.item)),extra,members:[e]});
 }
 return result.filter(x=>x.amount!==0);
}
function savingsBalance(entries,ym){
 const accounts=new Map();
 for(const e of ordered(entries.filter(e=>e.key==='savings'&&!excluded(e)&&dateOf(e.item)&&monthKey(dateOf(e.item))<=ym))){
  const id=nameOf(e.item);const a=accounts.get(id)||{snapshot:0,delta:0};
  if(isBalance(e))a.snapshot=Number(amountOf(e.item)||0);else a.delta+=Number(amountOf(e.item)||0);
  accounts.set(id,a);
 }
 for(const e of entries.filter(e=>dueBill(e)&&e.item.savingsAccount&&monthKey(dateOf(e.item))<=ym&&dateOf(e.item))){
  const a=accounts.get(e.item.savingsAccount)||{snapshot:0,delta:0};a.delta-=Number(amountOf(e.item)||0);accounts.set(e.item.savingsAccount,a);
 }
 return [...accounts.values()].reduce((n,a)=>n+a.snapshot+a.delta,0);
}
function totals(entries,ym){
 const current=entries.filter(e=>!isSpace(e)&&e.key!=='records'&&!excluded(e)&&monthKey(dateOf(e.item))===ym);
 const sum=es=>es.reduce((n,e)=>n+(Number(amountOf(e.item))||0),0);
 const income=sum(current.filter(e=>categoryOf(e)==='Income'));
 const available=income-sum(current.filter(e=>dueBill(e)&&!e.item.savingsAccount));
 const savings=savingsBalance(entries,ym);
 const iou=sum(entries.filter(e=>e.key==='iou'&&!excluded(e)&&!isPaid(e)));
 return {income,available,savings,iou};
}
function renderSummary(entries){
 const ym=currentMonth(),v=totals(entries,ym);
 for(const el of mainPage.querySelectorAll('[data-summary]')){
  const k=el.dataset.summary,n=v[k],a=el.querySelector('strong');a.innerHTML=accounting(n,k==='available'&&n<0);
  a.style.color=k==='available'&&n<1000?'#e65c5c':(k==='available'&&n<2000||k==='savings'&&n<1000)?'#f29e9e':'';
 }
 document.getElementById('clearBill').hidden=today()<lastDay(ym);
}
async function commitWallet(change){
 if(saving||!ready)throw Error('Please finish the current action.');
 saving=true;logout.disabled=true;
 try{
  const current=generation,access=token,file=dataId;
  await navigator.locks.request('wallet-room-data:'+folderId,async()=>{
   const data=await readData(access,current,file);
   if(JSON.stringify(data)!==JSON.stringify(walletData))throw Error('Records changed elsewhere. Please sign in again.');
   change(data);await drive('upload/drive/v3/files/'+encodeURIComponent(file)+'?uploadType=media&fields=id',access,current,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});walletData=data;
  });
 }finally{saving=false;logout.disabled=false;}
}

function showMonthGroup(key,index,ym){
 const e={key,index,item:list(key)[index]};if(!e.item)return;

function clearMonth(){
 const ym=currentMonth();if(today()<lastDay(ym))return;
 const bills=sortItems(all().filter(e=>dueBill(e)&&monthKey(dateOf(e.item))===ym));
 openDialog(dialogHead('Clear Bill — '+tableDate(ym+'-01'))+'<form id="clearMonthForm" class="wallet-form">'+bills.map((e,i)=>'<div class="wallet-row"><span>'+esc(nameOf(e.item))+' '+esc(e.item.originMonth?tableDate(e.item.originMonth+'-01'):'')+'</span>'+accounting(amountOf(e.item))+'<select required name="bill'+i+'" aria-label="'+esc(nameOf(e.item))+'"><option value="">Select</option><option value="Paid"'+(isPaid(e)?' selected':'')+'>Paid</option><option value="Unpaid">Unpaid</option></select></div>').join('')+'<p class="muted" role="status"></p><div class="wallet-actions"><button type="submit">Clear Bill</button></div></form>');
 const form=dialog.querySelector('form');form.onsubmit=async ev=>{
  ev.preventDefault();if(saving)return;
  const choices=bills.map((e,i)=>form.elements['bill'+i].value);if(choices.some(x=>!x))return;
  const total=kind=>bills.reduce((n,e,i)=>n+(choices[i]===kind?Number(amountOf(e.item)||0):0),0);
  if(!confirm('Paid: '+money(total('Paid'))+'\nUnpaid: '+money(total('Unpaid'))+'\nConfirm to clear bills? Unpaid bills move to next month.'))return;
  try{await commitWallet(data=>{
   data.settings??={};if(data.settings.budgetMonth&&data.settings.budgetMonth!==ym)throw Error('Month already changed.');
   const next=shiftMonth(ym,1);
   bills.forEach((e,i)=>{
    const x=data[e.key][e.index];if(choices[i]==='Paid'){x.paid=true;x.status='Paid';x.clearedOn=today();}
    else{
     const copy={...x,id:crypto.randomUUID(),paid:false,status:'Unpaid',recurring:false,originMonth:x.originMonth||ym,carryOf:x.carryOf||x.id||e.key+':'+e.index,date:next+'-'+String(Math.min(Number(dateOf(x).slice(8,10))||28,Number(lastDay(next).slice(8,10)))).padStart(2,'0')};
     delete copy.seriesId;delete copy.startDate;delete copy.endDate;
     x.status='Carried forward';x.paid=false;x.carriedTo=copy.id;
     data[e.key].push(copy);
    }
   });
   data.settings.budgetMonth=next;
  });calendarDate=new Date(shiftMonth(ym,1)+'-01T12:00:00');closeRefresh();}catch(err){showError(err);}
 };
}
function trashEntry(key,index){
 const e=list(key)[index];if(!e||!confirm('Move this item to Trash?'))return;
 commitWallet(data=>{data.trash??=[];data.trash.push({id:crypto.randomUUID(),key,item:data[key][index],deletedAt:new Date().toISOString()});data[key].splice(index,1);}).then(closeRefresh).catch(showError);
}
function restoreTrash(index){
 const t=list('trash')[index];if(!t||!['items','projects','records','savings','iou'].includes(t.key))return;
 commitWallet(data=>{data[t.key]??=[];if(t.item.id&&data[t.key].some(x=>x.id===t.item.id))throw Error('This item already exists. Restore cancelled.');data[t.key].push(t.item);data.trash.splice(index,1);}).then(()=>setView('Trash')).catch(showError);
}

function recordRows(items,entries){
 const seen=new Set(),groups=new Map();
 for(const e of sortItems(items)){
  const info=seriesInfo(e,entries),id=info.recurring?JSON.stringify([seriesKey(e),info.first.item.id||info.first.key+':'+info.first.index]):e.key+':'+e.index;
  if(seen.has(id))continue;seen.add(id);
  const members=info.members.filter(x=>isInactive(x)===isInactive(e));
  const chosen=members.find(x=>monthKey(dateOf(x.item))===currentMonth())||members.at(-1)||e;
  const st=info.recurring&&!isInactive(e)?'Ongoing':statusLabel(chosen);
  const date=info.recurring?(info.end||info.start):dateOf(chosen.item);
  const group=recordsMode==='By Event'?categoryOf(e):(st||'No status')+' · '+(info.recurring&&!info.end?'Ongoing':tableDate(date)||'No date');
  const html='<button type="button" class="entry-row record-summary"'+(recordsMode==='By Event'?dragAttr(e):'')+' data-series="'+chosen.key+':'+chosen.index+'"><span>'+esc(nameOf(e.item))+'</span><small>'+esc(tableDate(date))+'</small><small>'+esc(st)+'</small>'+accounting(amountOf(chosen.item))+'</button>';
  if(!groups.has(group))groups.set(group,[]);groups.get(group).push(html);
 }
 return [...groups].map(([k,rs])=>'<div class="record-date-group"><strong>'+esc(k)+'</strong>'+rs.join('')+'</div>').join('');
}

function renderCalendar(entries){
 walletContent.classList.add('wallet-card','wallet-panel');const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
 const controls='<div class="wallet-row">'+title('Calendar')+'<div class="wallet-actions">'+['Month','Week'].map(v=>'<button data-cal="'+v+'" class="'+(calendarMode===v?'selected':'')+'">'+v+'</button>').join('')+'</div></div><div class="wallet-row">'+directionButton('left','data-step="-1"','Previous')+'<strong class="calendar-heading">'+esc(calendarMode==='Month'?monthLabel(calendarDate):displayDate(dayKey(calendarDate)))+'</strong>'+directionButton('right','data-step="1"','Next')+'</div>';

  const defaults=es.filter(baseBill);
  const bill=(month||h===null)&&defaults.length?'<button class="calendar-event'+(date<today()&&defaults.every(isPaid)?' past-cleared':'')+'" data-main-bill="'+date+'">Main bill</button>':'';
  return bill+es.filter(e=>!baseBill(e)&&(month||(h===null?!e.item.time:parseInt(e.item.time,10)===h))).map(event).join('');
 };
 let body='';
 if(calendarMode==='Month'){

 }else{
 const start=new Date(calendarDate);if(calendarMode==='Week')start.setDate(start.getDate()-start.getDay());const days=Array.from({length:calendarMode==='Week'?7:1},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
 const eventsFor=(d,h)=>eventsForDate(d,h);

 }
 walletContent.innerHTML=controls+'<div class="wallet-scroll">'+body+'</div>'+arrows;

 const category=key==='projects'?'My Space':x.category||(key==='savings'?'Savings':key==='iou'?'IOU':'Expense');
 const field=(label,n,v='',type='text')=>'<label>'+label+'<input name="'+n+'" type="'+type+'" value="'+esc(v)+'" '+(n==='name'?'required':'')+(type==='number'?' step="1"':'')+'></label>';
 dialog.innerHTML='<form class="wallet-form" id="walletEntry"><div class="wallet-row"><h2>'+(e?'Edit Item':'Add Item')+'</h2><div class="wallet-actions"><button type="button" data-close>Close</button></div></div>'+picker('Category','category',category,[...new Set(['Expense','Income','Savings','IOU','My Space',category])])+field('Group','group',x.group)+field('Item','name',nameOf(x))+'<div id="subjectField" '+(category==='My Space'?'':'hidden')+'>'+field('Subject','subject',x.subject)+'</div><div class="record-grid">'+field('Amount (RM)','amount',amountOf(x)??'','number')+picker('Date','date',dateOf(x))+picker('Time','time',x.time||'')+picker('Status','status',x.status||'Saved',[...new Set(['Saved','In progress','Completed','Cancelled',x.status||'Saved'])])+'</div><label><span><input type="checkbox" name="recurring" '+(info.recurring?'checked':'')+'> Recurring</span></label><div class="recurrence-fields" '+(info.recurring?'':'hidden')+'>'+picker('Start date','startDate',info.start||dateOf(x))+picker('End date','endDate',info.end)+'</div><label>Notes<textarea name="notes" rows="3">'+esc(x.notes||'')+'</textarea></label><label>Checklist / Subtasks<textarea name="tasks" rows="2">'+esc((x.tasks||[]).map(t=>typeof t==='string'?t:t.text).join('\n'))+'</textarea></label>'+field('Contact','contact',x.contact)+field('Website','website',x.website)+ '<p class="muted" id="entryStatus" role="status"></p><div class="wallet-actions"><button type="button" data-close>Cancel</button><button type="submit">Save Item</button></div></form>';
 const form=dialog.querySelector('form');form.querySelector('[name=recurring]').onchange=ev=>{form.querySelector('.recurrence-fields').hidden=!ev.target.checked;};form.onsubmit=async event=>{event.preventDefault();if(saving)return;const values=Object.fromEntries(new FormData(form));const taskLines=values.tasks.split('\n').filter(t=>t.trim());values.recurring=!!values.recurring;if(!values.recurring){values.startDate='';values.endDate='';}else{values.startDate=values.startDate||values.date;if(!values.startDate||values.endDate&&values.endDate<values.startDate){dialog.querySelector('#entryStatus').textContent='Check the start and end dates.';return;}}const updated={...x,...values,name:values.name.trim(),amount:values.amount===''?null:Number(values.amount),tasks:taskLines.map(text=>({text,done:(x.tasks||[]).some(t=>t.text===text&&t.done)})),id:x.id||crypto.randomUUID()};const dest=({ 'My Space':'projects',Savings:'savings',IOU:'iou'}[values.category]||'items');const msg=dialog.querySelector('#entryStatus');saving=true;form.querySelector('button[type=submit]').disabled=true;logout.disabled=true;try{const current=generation,access=token,file=dataId;await navigator.locks.request('wallet-room-data:'+folderId,async()=>{const data=await readData(access,current,file);if(JSON.stringify(data)!==JSON.stringify(walletData))throw Error('Records changed elsewhere. Please sign in again.');const arr=data[dest]||[];if(e&&dest===key)arr[index]=updated;else {if(e)data[key].splice(index,1);arr.push(updated);}data[dest]=arr;await drive('upload/drive/v3/files/'+encodeURIComponent(file)+'?uploadType=media&fields=id',access,current,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});walletData=data;});dialog.close();setView(viewName);}catch(err){msg.textContent=err.message;}finally{saving=false;logout.disabled=false;form.querySelector('button[type=submit]').disabled=false;}};
 if(!dialog.open)dialog.showModal();

 else if(w&&b.hasAttribute('data-picker-toggle')){

 else if(w&&d.pickerMonth){const p=w.querySelector('.wallet-picker-options'),dt=new Date(Number(p.dataset.year),Number(p.dataset.month)+Number(d.pickerMonth),1);fillDate(p,dt.getFullYear(),dt.getMonth());}
 else if(w&&b.hasAttribute('data-time-set')){const h=w.querySelector('[data-hour]'),m=w.querySelector('[data-minute]');if(h.value===''||m.value==='')return;if(!h.reportValidity()||!m.reportValidity())return;choosePicker(w,String(h.value).padStart(2,'0')+':'+String(m.value).padStart(2,'0'));}

let client, token=null, generation=0, folderId=null, dataId=null, savedNote='', saving=false, ready=false;
const test=document.getElementById('storageTest'), note=document.getElementById('testNote');
function checkSession(current){if(current!==generation)throw new Error('Session changed.');}
async function drive(path,access,current,options={}){
 checkSession(current);
 const res=await fetch('https://www.googleapis.com/'+path,{...options,headers:{Authorization:'Bearer '+access,...options.headers},cache:'no-store'});
 checkSession(current);
 if(!res.ok)throw new Error('Drive request failed ('+res.status+').');
 return res.json();
}
async function readData(access,current,file){
 const data=await drive('drive/v3/files/'+encodeURIComponent(file)+'?alt=media',access,current);
 if(!data||data.schemaVersion!==1||Array.isArray(data)||typeof data!=='object')throw new Error('Unrecognized data file. No changes made.');
 return data;
}
async function ensureData(access,current,folder){
 return navigator.locks.request('wallet-room-data:'+folder,async()=>{
  let page,matches=[];
  do{
   const q=new URLSearchParams({q:"trashed = false and '"+folder+"' in parents and name = 'wallet-data.json'",fields:'nextPageToken,files(id,name,mimeType)',pageSize:'100'});
   if(page)q.set('pageToken',page);
   const result=await drive('drive/v3/files?'+q,access,current);
   matches.push(...(result.files||[]));page=result.nextPageToken;
  }while(page);
  if(matches.length>1)throw new Error('Multiple data files found. No changes made.');
  let file=matches[0]?.id;
  if(!file){
   const boundary='wallet_room_'+crypto.randomUUID();
   const metadata={name:'wallet-data.json',mimeType:'application/json',parents:[folder],appProperties:{walletRoom:'data-v1'}};
   const empty={schemaVersion:1,items:[],projects:[],records:[],savings:[],iou:[],settings:{},testNote:''};
   const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(empty)+'\r\n--'+boundary+'--\r\n';
   const created=await drive('upload/drive/v3/files?uploadType=multipart&fields=id',access,current,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
   file=created.id;
   if(!file)throw new Error('Data file creation could not be confirmed.');
  }
  return {file,data:await readData(access,current,file)};
 });
}
async function savePending(){
 if(!ready||saving||note.value===savedNote)return;
 saving=true;logout.disabled=true;
 const current=generation,access=token,file=dataId,folder=folderId;
 let failed=false;
 try{
  while(current===generation&&note.value!==savedNote){
   const value=note.value;status.textContent='Saving…';
   await navigator.locks.request('wallet-room-data:'+folder,async()=>{
    const data=await readData(access,current,file);
    if((data.testNote??'')!==savedNote)throw new Error('The file changed elsewhere. Reconnect before saving.');
    data.testNote=value;
    await drive('upload/drive/v3/files/'+encodeURIComponent(file)+'?uploadType=media&fields=id',access,current,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   });
   checkSession(current);savedNote=value;
  }
  status.textContent='Saved to Google Drive.';
 }catch(e){failed=true;if(current===generation)status.textContent='Not saved. '+e.message;}
 finally{if(current===generation){saving=false;logout.disabled=false;if(failed)note.setAttribute('aria-invalid','true');else note.removeAttribute('aria-invalid');}}
}
note.addEventListener('input',savePending);
window.addEventListener('beforeunload',e=>{if(ready&&note.value!==savedNote){e.preventDefault();e.returnValue='';}});
async function ensureFolder(access,current){
 const base='https://www.googleapis.com/drive/v3/';
 async function request(path,options={}){
  if(current!==generation)throw new Error('Session changed.');
  const res=await fetch(base+path,{...options,headers:{Authorization:'Bearer '+access,...options.headers},cache:'no-store'});
  if(!res.ok)throw new Error('Drive request failed ('+res.status+').');
  return res.json();
 }
 const account=await request('about?fields=user(permissionId)');
 const accountId=account.user?.permissionId;
 if(!accountId)throw new Error('Unable to identify Drive account.');
 if(!navigator.locks)throw new Error('Use Chrome to safely set up your folder.');
 return navigator.locks.request('wallet-room-folder:'+accountId,async()=>{
  const matches=[];let page;
  do{
   const q=new URLSearchParams({q:"trashed = false and mimeType = 'application/vnd.google-apps.folder' and 'root' in parents and name = 'Wallet room'",fields:'nextPageToken,files(id,name,appProperties)',pageSize:'100'});
   if(page)q.set('pageToken',page);
   const result=await request('files?'+q);matches.push(...(result.files||[]));page=result.nextPageToken;
  }while(page);
  if(matches.length>1)throw new Error('Multiple Wallet room folders found. Please check Google Drive before continuing.');
  if(matches.length===1)return matches[0].id;
  const created=await request('files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Wallet room',mimeType:'application/vnd.google-apps.folder',parents:['root'],appProperties:{walletRoom:'root-v1'}})});
  if(!created.id)throw new Error('Folder creation could not be confirmed.');
  return created.id;
 });
}
function initialize(){
 if(!window.google?.accounts?.oauth2){status.textContent='Google login could not load. Refresh and try again.';return;}
 client=google.accounts.oauth2.initTokenClient({
 client_id:'623537097247-8cov6532dpjs199jmoqapa6g6h4ogvh1.apps.googleusercontent.com',
 scope, include_granted_scopes:false,
 callback:async response=>{
 if(response.error||!response.access_token){fail('Google authorization was not completed.');return;}
 if(!google.accounts.oauth2.hasGrantedAllScopes(response,scope)){fail('Drive permission is required.');return;}
 token=response.access_token;
 const current=++generation;
 setProgress(25);
 try{
 const found=await ensureFolder(response.access_token,current);
 if(current!==generation)return;
 folderId=found;

 const loaded=await ensureData(response.access_token,current,found);
 checkSession(current);
 dataId=loaded.file; walletData=loaded.data; savedNote=String(loaded.data.testNote??''); note.value=savedNote; ready=true;

 calendarDate=new Date(currentMonth()+'-01T12:00:00');
 setView('2 Months');

 await new Promise(resolve=>setTimeout(resolve,220));
 checkSession(current);
 card.hidden=true; mainPage.hidden=false; logout.hidden=false; status.textContent='';
 if(today()>lastDay(currentMonth()))alert('Please clear your bill');
 }catch(e){if(current===generation){ready=false;walletData=null;token=null;folderId=null;dataId=null;fail(e.message);}}
 },
 error_callback:()=>{fail('Google login was closed or blocked. Try again.');}
 });
 login.disabled=false;
}
